<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CODE CITY // codebase visualizer</title>
<style>
  /* ---------------------------------------------------------------- base */
  /* Apollo "Future" design language — future-dark theme.
     Chrome sits on the zinc surface ramp; cyan is reserved for glow/values and
     orange is semantic only (heat, drafts, alerts, active mode). */
  :root {
    --surface: #09090b;
    --surface-raised: #18181b;
    --surface-overlay: #27272a;
    --surface-hover: #3f3f46;

    --foreground: #fafafa;
    --foreground-secondary: #f4f4f5;
    --foreground-muted: #a1a1aa;
    --foreground-subtle: #71717a;

    --border: #3f3f46;
    --border-subtle: #27272a;

    --brand: #0891b2;
    --accent-muted: #22d3ee;

    /* semantic + theatrical */
    --scene-bg: #05080f;
    --orange: #fa4616;
    --green: #4ade80;
    --violet: #a78bfa;

    --panel: rgba(24, 24, 27, 0.78);
    --panel-solid: rgba(24, 24, 27, 0.94);
    --mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--scene-bg); color: var(--foreground);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  #scene { position: fixed; inset: 0; }

  /* ------------------------------------------------------------- CRT skin */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
  }
  #crt::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(120, 235, 255, 0.045) 0px,
      rgba(120, 235, 255, 0.045) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
    opacity: 0.55;
  }
  #crt::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 88%, rgba(0,0,0,0.82) 100%),
      linear-gradient(180deg, rgba(10,40,60,0.16), rgba(0,0,0,0) 30%);
  }

  /* ---------------------------------------------------------------- HUD */
  .hud { position: fixed; z-index: 40; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(9px) saturate(1.2);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 0 24px rgba(8, 145, 178, 0.14),
      inset 0 0 30px rgba(8, 145, 178, 0.06);
    position: relative;
  }
  /* corner ticks */
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 9px; height: 9px;
    border: 1px solid var(--brand); opacity: 0.9; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .panel-title {
    font-size: 9px; letter-spacing: 0.28em; color: var(--foreground-muted);
    text-transform: uppercase; margin-bottom: 8px;
  }

  /* --- top bar */
  #topbar {
    top: 14px; left: 14px; right: 14px;
    display: flex; align-items: stretch; gap: 10px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }

  #brand {
    padding: 9px 14px; display: flex; align-items: center; gap: 10px;
    text-transform: uppercase; white-space: nowrap;
  }
  #brand .dot {
    width: 7px; height: 7px; background: var(--orange); border-radius: 50%;
    box-shadow: 0 0 10px var(--orange); animation: pulse 2.4s ease-in-out infinite;
  }
  #brand b { color: var(--foreground); font-weight: 600; letter-spacing: 0.2em; }
  #brand span { color: var(--foreground-muted); font-size: 10px; letter-spacing: 0.16em; }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  #breadcrumb {
    flex: 1; min-width: 0; padding: 9px 14px;
    display: flex; align-items: center; gap: 2px;
    overflow-x: auto; scrollbar-width: none; white-space: nowrap;
  }
  #breadcrumb::-webkit-scrollbar { display: none; }
  #breadcrumb .crumb {
    color: var(--foreground); text-transform: uppercase; cursor: pointer;
    padding: 3px 7px; border: 1px solid transparent; transition: 120ms;
  }
  #breadcrumb .crumb:hover { border-color: var(--brand); color: var(--foreground); background: var(--surface-overlay); }
  #breadcrumb .crumb.active { color: var(--orange); border-color: rgba(250,70,22,0.5); background: rgba(250,70,22,0.1); }
  #breadcrumb .sep { color: var(--foreground-muted); opacity: 0.5; }

  #stats { padding: 9px 14px; color: var(--foreground-muted); white-space: nowrap; display: flex; gap: 14px; }
  #stats b { color: var(--accent-muted); font-weight: 500; }

  /* --- left control stack */
  #controls {
    left: 14px; top: 66px; width: 214px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #controls > .panel { padding: 11px 12px; }

  .btnrow { display: flex; flex-direction: column; gap: 5px; }

  button.mode, button.toggle {
    appearance: none; width: 100%; text-align: left; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--foreground);
    background: rgba(39, 39, 42, 0.72);
    border: 1px solid var(--border);
    padding: 7px 9px; transition: 120ms;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  button.mode:hover, button.toggle:hover {
    background: var(--surface-hover); color: var(--foreground); border-color: var(--brand);
  }
  button.mode.active {
    color: #ffd9cd; border-color: var(--orange);
    background: linear-gradient(90deg, rgba(250,70,22,0.28), rgba(250,70,22,0.06));
    box-shadow: 0 0 16px rgba(250,70,22,0.22), inset 0 0 14px rgba(250,70,22,0.12);
  }
  button.toggle .led {
    width: 7px; height: 7px; border: 1px solid var(--border); flex: none;
  }
  button.toggle.active { border-color: var(--orange); color: #ffd9cd; }
  button.toggle.active .led { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 8px var(--orange); }

  /* --- legend */
  #legend .row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0; color: var(--foreground-muted); }
  #legend .sw { width: 11px; height: 11px; flex: none; border: 1px solid rgba(255,255,255,0.18); }
  #legend .row span { text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; }
  #ramp { height: 8px; margin: 6px 0 4px;
    background: linear-gradient(90deg, #3b4658, #fbbf24, #fa4616, #ef4444);
    border: 1px solid var(--border); }
  .ramp-labels { display: flex; justify-content: space-between; color: var(--foreground-muted); font-size: 9px; letter-spacing: 0.14em; }

  /* --- help */
  #help { position: fixed; left: 14px; bottom: 14px; width: 214px; padding: 10px 12px; color: var(--foreground-muted); font-size: 9.5px; line-height: 1.75; }
  #help kbd {
    color: var(--accent-muted); border: 1px solid var(--border); padding: 0 4px;
    background: rgba(39,39,42,0.7); font-family: var(--mono); font-size: 9px;
  }

  /* --- right sidebar */
  #sidebar {
    position: fixed; z-index: 44; right: 14px; top: 66px; bottom: 14px;
    width: 300px; transition: width 220ms ease;
    display: flex; flex-direction: column;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    backdrop-filter: blur(9px) saturate(1.2);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 24px rgba(8,145,178,0.14), inset 0 0 30px rgba(8,145,178,0.06);
  }
  #sidebar.wide { width: 560px; }
  #sidebar::before, #sidebar::after {
    content: ""; position: absolute; width: 9px; height: 9px;
    border: 1px solid var(--brand); opacity: 0.9; pointer-events: none;
  }
  #sidebar::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  #sidebar::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  #sb-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--border-subtle); flex: none;
  }
  #sb-head .t { font-size: 9px; letter-spacing: 0.28em; color: var(--foreground-muted); text-transform: uppercase; }
  #sb-width {
    appearance: none; cursor: pointer; font-family: var(--mono); font-size: 10px;
    color: var(--accent-muted); background: var(--surface-overlay);
    border: 1px solid var(--border); padding: 2px 6px; letter-spacing: 0.1em;
  }
  #sb-width:hover { background: var(--surface-hover); color: var(--foreground); border-color: var(--brand); }

  #sb-body { overflow-y: auto; overflow-x: hidden; padding: 0 0 14px; flex: 1; scrollbar-width: thin; }
  #sb-body::-webkit-scrollbar { width: 6px; }
  #sb-body::-webkit-scrollbar-thumb { background: var(--border); }

  .sb-sec { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); }
  .sb-sec > .h {
    font-size: 9px; letter-spacing: 0.28em; color: var(--foreground-muted);
    text-transform: uppercase; margin-bottom: 7px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .sb-sec > .h em { font-style: normal; color: var(--foreground-subtle); letter-spacing: 0.12em; }
  .sb-hint { color: var(--foreground-muted); font-size: 10px; opacity: 0.65; letter-spacing: 0.1em; }

  .sb-name { color: var(--foreground); font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; word-break: break-all; }
  .sb-kind { font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; margin-top: 2px; }
  .sb-path { color: var(--foreground-muted); font-size: 9.5px; margin-top: 5px; word-break: break-all; letter-spacing: 0.02em; }
  .sb-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px 8px;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle);
  }
  .sb-grid .k { color: var(--foreground-muted); font-size: 8.5px; letter-spacing: 0.16em; }
  .sb-grid .v { color: var(--accent-muted); font-size: 13px; }

  .sb-sub { color: var(--foreground-muted); font-size: 9px; letter-spacing: 0.2em; margin: 10px 0 4px; text-transform: uppercase; }
  .sb-pr { font-size: 10px; color: var(--foreground); line-height: 1.55; margin-bottom: 4px; }
  .sb-pr .num { color: var(--orange); }
  .sb-pr .who { color: var(--foreground-muted); }
  .sb-pr .draft { color: var(--orange); border: 1px solid rgba(250,70,22,0.5); padding: 0 3px; font-size: 8.5px; letter-spacing: 0.12em; }
  .sb-pr .add { color: var(--green); }
  .sb-pr .del { color: #ef4444; }
  .sb-pr .age { color: var(--foreground-muted); font-size: 9px; }

  .sb-commit { font-size: 9.5px; color: var(--foreground); line-height: 1.5; margin-bottom: 3px; letter-spacing: 0.02em; }
  .sb-commit .h { color: var(--orange); font-size: 9.5px; letter-spacing: 0.05em; display: inline; text-decoration: none; }
  a.sb-commit .h:hover, .sb-commit a.h:hover { text-decoration: underline; }
  .sb-commit .when { color: var(--foreground-muted); }
  .sb-commit .who { color: var(--violet); }
  .sb-commit.near { background: rgba(8,145,178,0.18); }

  .sb-code {
    max-height: 260px; overflow: auto; margin-top: 6px;
    background: rgba(2,7,14,0.85); border: 1px solid var(--border-subtle);
    font-size: 9.5px; line-height: 1.45; letter-spacing: 0; white-space: pre;
    color: #b9e6f2; padding: 6px 8px;
  }
  #sidebar.wide .sb-code { max-height: 420px; }
  .sb-code::-webkit-scrollbar { width: 6px; height: 6px; }
  .sb-code::-webkit-scrollbar-thumb { background: var(--border); }
  .sb-code .ln { color: var(--foreground-subtle); }
  .sb-code .add { color: #6ee7a2; }
  .sb-code .del { color: #f08a8a; }
  .sb-code .meta { color: var(--violet); opacity: 0.8; }

  /* --- timeline */
  #timeline {
    /* centered in the space the control stack and sidebar leave free */
    position: fixed; z-index: 44; bottom: 14px;
    left: 244px; right: calc(var(--sb-w, 300px) + 28px);
    width: auto; max-width: 720px; margin: 0 auto;
    padding: 8px 12px 9px;
    display: none;
  }
  #timeline.on { display: block; }
  #tl-top { display: flex; align-items: center; gap: 10px; }
  #tl-play {
    appearance: none; cursor: pointer; font-family: var(--mono); font-size: 11px;
    color: var(--accent-muted); background: var(--surface-overlay); border: 1px solid var(--border);
    width: 26px; height: 22px; flex: none; line-height: 1;
  }
  #tl-play.on { color: #ffd9cd; border-color: var(--orange); background: rgba(250,70,22,0.2); }
  #tl-date { color: var(--accent-muted); font-size: 10.5px; letter-spacing: 0.16em; white-space: nowrap; }
  #tl-date a.tl-hash { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  #tl-date a.tl-hash:hover { text-decoration: none; border-bottom-style: solid; }
  #tl-meta { color: var(--foreground-muted); font-size: 9px; letter-spacing: 0.14em; margin-left: auto; white-space: nowrap; }
  #tl-track { position: relative; height: 30px; margin-top: 5px; }
  #tl-spark { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.75; }
  #tl-range {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    appearance: none; background: transparent; cursor: pointer;
  }
  #tl-range::-webkit-slider-runnable-track { height: 30px; background: transparent; }
  #tl-range::-webkit-slider-thumb {
    appearance: none; width: 3px; height: 30px; background: var(--orange);
    box-shadow: 0 0 10px var(--orange); border: 0; border-radius: 0;
  }
  #tl-range::-moz-range-thumb { width: 3px; height: 30px; background: var(--orange); border: 0; border-radius: 0; }

  /* --- command palette (⌘P / ⌘F) */
  #palette {
    position: fixed; z-index: 48; top: 76px; left: 50%; transform: translateX(-50%) translateY(-8px);
    width: min(680px, calc(100vw - 520px)); min-width: 380px;
    background: var(--panel-solid);
    padding: 10px 10px 8px;
    display: none; opacity: 0; transition: opacity 110ms ease, transform 110ms ease;
  }
  #palette.on { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  #pal-tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  #pal-tabs button {
    appearance: none; cursor: pointer; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--foreground-muted);
    background: rgba(39,39,42,0.72); border: 1px solid var(--border); padding: 4px 9px;
  }
  #pal-tabs button:hover { background: var(--surface-hover); color: var(--foreground); border-color: var(--brand); }
  #pal-tabs button.active {
    color: #ffd9cd; border-color: var(--orange);
    background: linear-gradient(90deg, rgba(250,70,22,0.28), rgba(250,70,22,0.06));
    box-shadow: 0 0 14px rgba(250,70,22,0.2);
  }
  #pal-status { margin-left: auto; color: var(--foreground-subtle); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }

  #pal-input {
    width: 100%; appearance: none; font-family: var(--mono); font-size: 13px;
    letter-spacing: 0.08em; color: var(--foreground);
    background: rgba(2,7,14,0.85); border: 1px solid var(--border);
    padding: 8px 10px; outline: none;
  }
  #pal-input:focus { border-color: var(--brand); box-shadow: 0 0 14px rgba(8,145,178,0.28); }
  #pal-input::placeholder { color: var(--foreground-subtle); }

  #pal-list { max-height: 46vh; overflow-y: auto; margin-top: 6px; scrollbar-width: thin; }
  #pal-list::-webkit-scrollbar { width: 6px; }
  #pal-list::-webkit-scrollbar-thumb { background: var(--border); }

  .pal-row {
    display: flex; align-items: baseline; gap: 8px; cursor: pointer;
    padding: 4px 7px; border: 1px solid transparent; font-size: 11px; white-space: nowrap;
  }
  .pal-row:hover { background: var(--surface-overlay); }
  .pal-row.active { background: rgba(8,145,178,0.2); border-color: var(--brand); }
  .pal-row .tag {
    flex: none; font-size: 8px; letter-spacing: 0.14em; color: var(--foreground-subtle);
    border: 1px solid var(--border-subtle); padding: 0 3px; min-width: 26px; text-align: center;
  }
  .pal-row .tag.mod { color: var(--violet); border-color: rgba(167,139,250,0.5); }
  .pal-row .nm { color: var(--foreground); flex: none; }
  .pal-row .dir { color: var(--foreground-muted); font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; }
  .pal-row .cnt { margin-left: auto; color: var(--accent-muted); font-size: 9.5px; flex: none; }
  .pal-row.line { padding-left: 26px; font-size: 10px; }
  .pal-row.line .ln { color: var(--foreground-subtle); flex: none; min-width: 34px; text-align: right; }
  .pal-row.line .src { color: #b9e6f2; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
  .pal-row mark { background: rgba(250,70,22,0.28); color: #ffd9cd; }
  .pal-empty { color: var(--foreground-muted); font-size: 10px; letter-spacing: 0.14em; padding: 8px 7px; text-transform: uppercase; opacity: 0.7; }

  /* --- boot / error banner */
  #boot {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: radial-gradient(ellipse at center, #071120, #03060c 70%);
    color: var(--accent-muted); letter-spacing: 0.3em; text-transform: uppercase; font-size: 11px;
    transition: opacity 500ms;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .bar { width: 220px; height: 2px; background: var(--surface-overlay); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 40%; background: var(--accent-muted); box-shadow: 0 0 12px var(--accent-muted); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-110%) } 100% { transform: translateX(320%) } }

  #notice {
    position: fixed; z-index: 46; right: 14px; bottom: 14px; padding: 8px 12px;
    border: 1px solid rgba(250,70,22,0.55); background: rgba(38,12,6,0.8);
    color: #ffc7b5; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; display: none;
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="crt"></div>

  <!-- top bar -->
  <div id="topbar" class="hud">
    <div id="brand" class="panel">
      <i class="dot"></i><b>CODE&nbsp;CITY</b><span id="repo-name">—</span>
    </div>
    <nav id="breadcrumb" class="panel"></nav>
    <div id="stats" class="panel">
      <div>FILES <b id="stat-files">0</b></div>
      <div>MODULES <b id="stat-modules">0</b></div>
      <div>LOC <b id="stat-loc">0</b></div>
      <div>FPS <b id="stat-fps">—</b></div>
    </div>
  </div>

  <!-- left controls -->
  <div id="controls" class="hud">
    <div class="panel">
      <div class="panel-title">Overlay</div>
      <div class="btnrow" id="modes">
        <button class="mode" data-mode="structure">Structure</button>
        <button class="mode" data-mode="churn">Churn</button>
        <button class="mode" data-mode="fix">Fix hotspots</button>
        <button class="mode active" data-mode="recent">Recent focus</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Layers</div>
      <div class="btnrow" id="toggles">
        <button class="toggle" data-toggle="coupling">Coupling arcs<i class="led"></i></button>
        <button class="toggle active" data-toggle="people">People / PRs<i class="led"></i></button>
        <button class="toggle active" data-toggle="fx">FX / hologram<i class="led"></i></button>
      </div>
    </div>

    <div class="panel" id="legend">
      <div class="panel-title">Legend</div>
      <div id="legend-body"></div>
    </div>
  </div>

  <div id="help" class="hud panel">
    <div><kbd>DRAG</kbd> orbit &nbsp; <kbd>MMB</kbd> pan &nbsp; <kbd>WHEEL</kbd> zoom</div>
    <div><kbd>CLICK</kbd> select &nbsp; <kbd>DBL</kbd> isolate</div>
    <div><kbd>ESC</kbd> up one level &nbsp; <kbd>C</kbd> copy path</div>
    <div><kbd>&#8984;P</kbd> find file &nbsp; <kbd>&#8984;F</kbd> find in files</div>
  </div>

  <!-- right sidebar -->
  <aside id="sidebar" class="hud">
    <div id="sb-head">
      <div class="t">Inspector</div>
      <button id="sb-width" type="button">&#10216;&#10217;</button>
    </div>
    <div id="sb-body"></div>
  </aside>

  <!-- history timeline -->
  <div id="timeline" class="hud panel">
    <div id="tl-top">
      <button id="tl-play" type="button">&#9654;</button>
      <div id="tl-date">—</div>
      <div id="tl-meta"></div>
    </div>
    <div id="tl-track">
      <canvas id="tl-spark"></canvas>
      <input id="tl-range" type="range" min="0" max="1000" value="1000" step="1" />
    </div>
  </div>

  <div id="notice"></div>

  <div id="boot">
    <div>Initializing city grid</div>
    <div class="bar"><i></i></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
