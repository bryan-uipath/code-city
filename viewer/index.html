<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CODE CITY // codebase visualizer</title>
<style>
  /* ---------------------------------------------------------------- base */
  :root {
    --bg: #05080f;
    --cyan: #22d3ee;
    --cyan-dim: rgba(34, 211, 238, 0.34);
    --cyan-faint: rgba(34, 211, 238, 0.12);
    --orange: #fa4616;
    --green: #4ade80;
    --violet: #a78bfa;
    --ink: #cdeef7;
    --ink-dim: #6c93a4;
    --panel: rgba(6, 14, 24, 0.72);
    --panel-solid: rgba(4, 10, 18, 0.92);
    --mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  #scene { position: fixed; inset: 0; }

  /* ------------------------------------------------------------- CRT skin */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
  }
  #crt::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(120, 235, 255, 0.045) 0px,
      rgba(120, 235, 255, 0.045) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
    opacity: 0.55;
  }
  #crt::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 88%, rgba(0,0,0,0.82) 100%),
      linear-gradient(180deg, rgba(10,40,60,0.16), rgba(0,0,0,0) 30%);
  }

  /* ---------------------------------------------------------------- HUD */
  .hud { position: fixed; z-index: 40; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    backdrop-filter: blur(9px) saturate(1.2);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 0 26px rgba(34, 211, 238, 0.09),
      inset 0 0 30px rgba(34, 211, 238, 0.05);
    position: relative;
  }
  /* corner ticks */
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 9px; height: 9px;
    border: 1px solid var(--cyan); opacity: 0.85; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .panel-title {
    font-size: 9px; letter-spacing: 0.28em; color: var(--ink-dim);
    text-transform: uppercase; margin-bottom: 8px;
  }

  /* --- top bar */
  #topbar {
    top: 14px; left: 14px; right: 14px;
    display: flex; align-items: stretch; gap: 10px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }

  #brand {
    padding: 9px 14px; display: flex; align-items: center; gap: 10px;
    text-transform: uppercase; white-space: nowrap;
  }
  #brand .dot {
    width: 7px; height: 7px; background: var(--orange); border-radius: 50%;
    box-shadow: 0 0 10px var(--orange); animation: pulse 2.4s ease-in-out infinite;
  }
  #brand b { color: #eafcff; font-weight: 600; letter-spacing: 0.2em; }
  #brand span { color: var(--ink-dim); font-size: 10px; letter-spacing: 0.16em; }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  #breadcrumb {
    flex: 1; min-width: 0; padding: 9px 14px;
    display: flex; align-items: center; gap: 2px;
    overflow-x: auto; scrollbar-width: none; white-space: nowrap;
  }
  #breadcrumb::-webkit-scrollbar { display: none; }
  #breadcrumb .crumb {
    color: var(--ink); text-transform: uppercase; cursor: pointer;
    padding: 3px 7px; border: 1px solid transparent; transition: 120ms;
  }
  #breadcrumb .crumb:hover { border-color: var(--cyan-dim); color: #fff; background: var(--cyan-faint); }
  #breadcrumb .crumb.active { color: var(--orange); border-color: rgba(250,70,22,0.5); background: rgba(250,70,22,0.1); }
  #breadcrumb .sep { color: var(--ink-dim); opacity: 0.5; }

  #stats { padding: 9px 14px; color: var(--ink-dim); white-space: nowrap; display: flex; gap: 14px; }
  #stats b { color: var(--cyan); font-weight: 500; }

  /* --- left control stack */
  #controls {
    left: 14px; top: 66px; width: 214px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #controls > .panel { padding: 11px 12px; }

  .btnrow { display: flex; flex-direction: column; gap: 5px; }

  button.mode, button.toggle {
    appearance: none; width: 100%; text-align: left; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--ink);
    background: rgba(34, 211, 238, 0.05);
    border: 1px solid var(--cyan-dim);
    padding: 7px 9px; transition: 120ms;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  button.mode:hover, button.toggle:hover {
    background: rgba(34, 211, 238, 0.15); color: #fff; border-color: var(--cyan);
  }
  button.mode.active {
    color: #ffd9cd; border-color: var(--orange);
    background: linear-gradient(90deg, rgba(250,70,22,0.28), rgba(250,70,22,0.06));
    box-shadow: 0 0 16px rgba(250,70,22,0.22), inset 0 0 14px rgba(250,70,22,0.12);
  }
  button.toggle .led {
    width: 7px; height: 7px; border: 1px solid var(--cyan-dim); flex: none;
  }
  button.toggle.active { border-color: var(--orange); color: #ffd9cd; }
  button.toggle.active .led { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 8px var(--orange); }

  /* --- legend */
  #legend .row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0; color: var(--ink-dim); }
  #legend .sw { width: 11px; height: 11px; flex: none; border: 1px solid rgba(255,255,255,0.18); }
  #legend .row span { text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; }
  #ramp { height: 8px; margin: 6px 0 4px;
    background: linear-gradient(90deg, #3b4658, #fbbf24, #fa4616, #ef4444);
    border: 1px solid var(--cyan-dim); }
  .ramp-labels { display: flex; justify-content: space-between; color: var(--ink-dim); font-size: 9px; letter-spacing: 0.14em; }

  /* --- help */
  #help { position: fixed; left: 14px; bottom: 14px; width: 214px; padding: 10px 12px; color: var(--ink-dim); font-size: 9.5px; line-height: 1.75; }
  #help kbd {
    color: var(--cyan); border: 1px solid var(--cyan-dim); padding: 0 4px;
    background: rgba(34,211,238,0.07); font-family: var(--mono); font-size: 9px;
  }

  /* --- tooltip */
  #tooltip {
    position: fixed; z-index: 45; pointer-events: none; display: none;
    max-width: 330px; padding: 10px 12px;
    background: var(--panel-solid); border: 1px solid var(--cyan);
    box-shadow: 0 0 26px rgba(34,211,238,0.18);
    line-height: 1.6;
  }
  #tooltip .tt-name { color: #eafcff; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; }
  #tooltip .tt-kind { font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; margin-top: 2px; }
  #tooltip .tt-path {
    color: var(--ink-dim); font-size: 9.5px; margin-top: 6px; word-break: break-all; letter-spacing: 0.02em;
  }
  #tooltip .tt-grid {
    display: grid; grid-template-columns: repeat(4, auto); gap: 4px 12px;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--cyan-faint);
  }
  #tooltip .tt-grid .k { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.18em; }
  #tooltip .tt-grid .v { color: var(--cyan); font-size: 13px; }
  #tooltip .tt-prs { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--cyan-faint); }
  #tooltip .tt-prs .h { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.2em; margin-bottom: 3px; }
  #tooltip .tt-prs .pr { font-size: 10px; color: var(--ink); }
  #tooltip .tt-prs .pr .num { color: var(--orange); }
  #tooltip .tt-prs .pr .who { color: var(--ink-dim); }

  /* --- boot / error banner */
  #boot {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: radial-gradient(ellipse at center, #071120, #03060c 70%);
    color: var(--cyan); letter-spacing: 0.3em; text-transform: uppercase; font-size: 11px;
    transition: opacity 500ms;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .bar { width: 220px; height: 2px; background: rgba(34,211,238,0.15); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 40%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-110%) } 100% { transform: translateX(320%) } }

  #notice {
    position: fixed; z-index: 46; right: 14px; bottom: 14px; padding: 8px 12px;
    border: 1px solid rgba(250,70,22,0.55); background: rgba(38,12,6,0.8);
    color: #ffc7b5; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; display: none;
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="crt"></div>

  <!-- top bar -->
  <div id="topbar" class="hud">
    <div id="brand" class="panel">
      <i class="dot"></i><b>CODE&nbsp;CITY</b><span id="repo-name">—</span>
    </div>
    <nav id="breadcrumb" class="panel"></nav>
    <div id="stats" class="panel">
      <div>FILES <b id="stat-files">0</b></div>
      <div>MODULES <b id="stat-modules">0</b></div>
      <div>LOC <b id="stat-loc">0</b></div>
      <div>FPS <b id="stat-fps">—</b></div>
    </div>
  </div>

  <!-- left controls -->
  <div id="controls" class="hud">
    <div class="panel">
      <div class="panel-title">Overlay</div>
      <div class="btnrow" id="modes">
        <button class="mode" data-mode="structure">Structure</button>
        <button class="mode" data-mode="churn">Churn</button>
        <button class="mode" data-mode="fix">Fix hotspots</button>
        <button class="mode active" data-mode="recent">Recent focus</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Layers</div>
      <div class="btnrow" id="toggles">
        <button class="toggle" data-toggle="coupling">Coupling arcs<i class="led"></i></button>
        <button class="toggle active" data-toggle="people">People / PRs<i class="led"></i></button>
        <button class="toggle active" data-toggle="fx">FX / hologram<i class="led"></i></button>
      </div>
    </div>

    <div class="panel" id="legend">
      <div class="panel-title">Legend</div>
      <div id="legend-body"></div>
    </div>
  </div>

  <div id="help" class="hud panel">
    <div><kbd>DRAG</kbd> orbit &nbsp; <kbd>WHEEL</kbd> zoom</div>
    <div><kbd>CLICK</kbd> select &nbsp; <kbd>DBL</kbd> fly to</div>
    <div><kbd>ESC</kbd> up one level &nbsp; <kbd>C</kbd> copy path</div>
  </div>

  <div id="tooltip"></div>
  <div id="notice"></div>

  <div id="boot">
    <div>Initializing city grid</div>
    <div class="bar"><i></i></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
